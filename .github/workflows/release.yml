# Builds and signs the installers when a GitHub release is published and
# attaches them to that release.  Nothing runs on ordinary pushes.
#
# Secrets (Settings ▸ Secrets and variables ▸ Actions):
#   macOS (Developer ID)            CSC_LINK            base64 of the .p12 export of "Developer ID Application: …"
#                                   CSC_KEY_PASSWORD    password of that .p12
#   macOS notarization              APPLE_ID            Apple-ID e-mail
#                                   APPLE_APP_SPECIFIC_PASSWORD   app-specific password (appleid.apple.com)
#                                   APPLE_TEAM_ID       10-character team id
#   Windows (optional, later)       WIN_CSC_LINK        base64 of the code-signing .pfx
#                                   WIN_CSC_KEY_PASSWORD
# Without the Windows secrets the Windows installer is built unsigned.
# The installers are uploaded to whichever release triggered the run (any tag name works);
# the file names carry the version from apps/desktop/package.json.
name: Release

on:
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: macOS
            os: macos-latest
            target: --mac
          - name: Windows
            os: windows-latest
            target: --win
          - name: Linux
            os: ubuntu-latest
            target: --linux
    steps:
      - uses: actions/checkout@v5

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build renderer, preload and main
        run: pnpm build

      - name: Package (macOS, signed + notarized)
        if: runner.os == 'macOS'
        working-directory: apps/desktop
        env:
          CSC_LINK: ${{ secrets.CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ secrets.CSC_KEY_PASSWORD }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: pnpm exec electron-builder --mac --publish never

      - name: Package (Windows)
        if: runner.os == 'Windows'
        working-directory: apps/desktop
        env:
          WIN_CSC_LINK: ${{ secrets.WIN_CSC_LINK }}
          WIN_CSC_KEY_PASSWORD: ${{ secrets.WIN_CSC_KEY_PASSWORD }}
        run: pnpm exec electron-builder --win --publish never

      - name: Package (Linux)
        if: runner.os == 'Linux'
        working-directory: apps/desktop
        run: pnpm exec electron-builder --linux --publish never

      - name: Attach installers to the release
        if: github.event_name == 'release'
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          shopt -s nullglob
          files=(apps/desktop/release/*.dmg apps/desktop/release/*.exe apps/desktop/release/*.AppImage apps/desktop/release/*.deb)
          echo "Uploading: ${files[*]}"
          gh release upload "${{ github.event.release.tag_name }}" "${files[@]}" --clobber --repo "${{ github.repository }}"

      - name: Keep the installers as workflow artifacts (manual runs)
        if: github.event_name == 'workflow_dispatch'
        uses: actions/upload-artifact@v6
        with:
          name: bluepy-${{ matrix.name }}
          path: |
            apps/desktop/release/*.dmg
            apps/desktop/release/*.exe
            apps/desktop/release/*.AppImage
            apps/desktop/release/*.deb
          if-no-files-found: ignore
