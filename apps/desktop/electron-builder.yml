appId: dev.heidkamp.bluepy
productName: BluePy
copyright: Copyright © 2026 Holger Heidkamp – GPL-3.0
directories:
  output: release
  buildResources: build
files:
  - out/**
  - package.json
extraResources:
  # The Python backend is shipped as plain source; it runs in the learner's Python.
  - from: ../../backend
    to: backend
    filter:
      - "**/*.py"
      - "!tests/**"
      - "!**/__pycache__/**"
  # Example projects (Project ▸ Beispiel öffnen) are copied to ~/Documents/BluePy on first use.
  - from: ../../examples
    to: examples
    filter:
      - "**/*"
      - "!**/__pycache__/**"
# Pyright's language server runs as a child process (ELECTRON_RUN_AS_NODE) and must be a real file, not inside the asar.
asarUnpack:
  - node_modules/pyright/**
npmRebuild: false

mac:
  category: public.app-category.developer-tools
  target:
    - target: dmg
      arch: [universal]
  hardenedRuntime: true
  gatekeeperAssess: false
  entitlements: build/entitlements.mac.plist
  entitlementsInherit: build/entitlements.mac.plist
  # Notarization: set APPLE_ID, APPLE_APP_SPECIFIC_PASSWORD and APPLE_TEAM_ID
  # in the environment (the Release workflow does); electron-builder picks them up.
  notarize: true
dmg:
  artifactName: ${productName}-${version}-mac.${ext}

win:
  target:
    - target: nsis
    - target: portable
  # Code signing: WIN_CSC_LINK / WIN_CSC_KEY_PASSWORD in the Release workflow; unsigned until the certificate exists.
  signAndEditExecutable: true
nsis:
  oneClick: false
  perMachine: false
  allowToChangeInstallationDirectory: true
  artifactName: ${productName}-${version}-setup.${ext}
portable:
  artifactName: ${productName}-${version}-portable.${ext}

linux:
  category: Development
  target:
    - deb
    - AppImage
  artifactName: ${productName}-${version}-linux-${arch}.${ext}

publish:
  provider: github
  owner: holger-dev
  repo: bluepy
  releaseType: release
